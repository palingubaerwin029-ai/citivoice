services:
  redis:
    image: redis:7-alpine
    container_name: citivoice-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: citivoice-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
    depends_on:
      - redis

  admin-web:
    build:
      context: ./admin-web
      args:
        REACT_APP_API_URL: /api
    container_name: citivoice-admin
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: citivoice-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - admin-web

volumes:
  redis_data:
